<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeFlow</title>
<meta name="theme-color" content="#2d6f9a">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f1f7;--tx:#0f2f47;--mu:#4d6b80;--gl:rgba(255,255,255,.46);--gb:rgba(255,255,255,.72);--gs:0 10px 40px rgba(30,90,130,.16);--pr:#2d6f9a;--pr2:#3da2bf;--am:#f6a800;--ok:#1f9d74;--no:#d6455d;--in:rgba(255,255,255,.6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081624;--tx:#e8f3fa;--mu:#8fb0c4;--gl:rgba(20,48,72,.5);--gb:rgba(120,190,230,.2);--gs:0 10px 40px rgba(0,0,0,.4);--in:rgba(10,30,48,.55)}}
:root[data-theme="dark"]{--bg:#081624;--tx:#e8f3fa;--mu:#8fb0c4;--gl:rgba(20,48,72,.5);--gb:rgba(120,190,230,.2);--gs:0 10px 40px rgba(0,0,0,.4);--in:rgba(10,30,48,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;transition:background .5s,color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;backdrop-filter:blur(14px)}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7;animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:#3da2bf;left:-12vmax;top:-14vmax}
.blobs i:nth-child(2){width:34vmax;height:34vmax;background:#f6a800;right:-10vmax;top:18vh;opacity:.45;animation-duration:23s}
.blobs i:nth-child(3){width:40vmax;height:40vmax;background:#2a5f8f;left:28vw;bottom:-22vmax;animation-duration:27s}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.2)}}
.glass{background:var(--gl);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--gb);box-shadow:var(--gs),inset 0 1px 0 rgba(255,255,255,.35);border-radius:22px;position:relative}
.glass.shine::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:250% 100%;animation:shine 6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;width:100%;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 20px rgba(45,111,154,.35)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.ghost{background:var(--in);border:1px solid var(--gb);padding:11px 16px;border-radius:14px;font-weight:600;width:100%;display:flex;gap:8px;justify-content:center;align-items:center}
input.f,select.f{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--gb);background:var(--in);color:var(--tx);font:inherit;margin-bottom:10px}
.tg{width:46px;height:26px;border-radius:99px;background:var(--in);border:1px solid var(--gb);position:relative;transition:.3s;flex:none}.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}.tg.on{background:var(--ok)}.tg.on::after{transform:translateX(20px)}#prof .glass{max-height:88vh;overflow:auto}@media(max-width:700px){nav{flex-wrap:wrap}nav .links{order:3;width:100%;flex:none}}
.ic{width:32px;height:32px;border-radius:10px;background:var(--in);font-size:.85rem;flex:none;transition:.2s}.ic:hover{transform:scale(1.12)}.err{color:var(--no);font-size:.8rem;min-height:1.1em;margin-bottom:6px}.bar{height:8px;border-radius:9px;background:var(--in);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:9px;transition:width .8s}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.logo img{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 14px rgba(45,111,154,.4)}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
.authwrap{width:min(440px,100%);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}}
.card{padding:28px}
.tabs{display:flex;background:var(--in);border-radius:14px;padding:4px;margin:18px 0;gap:4px}
.tabs button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:.85rem;color:var(--mu);transition:.25s}
.tabs button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 4px 12px rgba(45,111,154,.3)}
#aform{display:flex;flex-direction:column;min-height:240px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}.pills span{padding:6px 11px;border-radius:99px;background:var(--in);border:1px solid var(--gb);font-size:.75rem;font-weight:600;color:var(--mu)}
.hint{font-size:.85rem;color:var(--mu);margin-bottom:12px;line-height:1.5}
.or{text-align:center;color:var(--mu);font-size:.8rem;margin:12px 0}
.chip{position:absolute;padding:10px 14px;font-size:.8rem;font-weight:700;border-radius:16px;animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-16px) rotate(2deg)}}
.pop{display:grid;place-items:center;text-align:center;gap:8px;padding:30px}
.check{width:84px;height:84px;border-radius:50%;background:var(--ok);display:grid;place-items:center;animation:pulse 1s ease-out infinite}
.check svg{width:44px;stroke:#fff;stroke-width:5;fill:none;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .6s .2s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,116,.55)}100%{box-shadow:0 0 0 28px rgba(31,157,116,0)}}
/* app */
#app{display:none;max-width:1180px;margin:0 auto;padding:16px 16px 120px}
nav{display:flex;align-items:center;gap:8px;padding:10px 14px;position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;animation:rise .8s both}
nav .links{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav .links button{padding:9px 14px;border-radius:12px;font-weight:600;font-size:.88rem;white-space:nowrap;color:var(--mu);transition:.25s;display:flex;gap:6px;align-items:center}
nav .links button:hover{color:var(--tx);background:var(--in)}
nav .links button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 16px rgba(45,111,154,.4)}
.ib{width:40px;height:40px;border-radius:12px;background:var(--in);border:1px solid var(--gb);position:relative;font-size:1.1rem}
.ib .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;background:var(--no);border-radius:50%;animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{transform:scale(1.5);opacity:.5}}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--am),#ff7a59);display:grid;place-items:center;font-weight:800;color:#fff}
.menu{position:absolute;right:0;top:56px;width:270px;padding:14px;display:none;z-index:40}
.menu.open{display:block;animation:rise .35s both}
.menu p{font-size:.85rem;padding:8px 4px;border-bottom:1px solid var(--gb)}.menu p:last-child{border:0}
main{margin-top:22px}
.view{display:none}.view.on{display:block}
.head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.head h1{font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.03em;line-height:1.1}
.head span{color:var(--mu);font-size:.9rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:820px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}nav .logo span{display:none}}
.p{padding:20px}
h3{font-size:1rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
h3 small{font-weight:600;color:var(--pr2);font-size:.78rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px;border-radius:16px;background:var(--in);border:1px solid var(--gb);transition:transform .25s}
.stat:hover{transform:translateY(-4px)}
.stat small{color:var(--mu);font-size:.75rem;display:block}.stat b{font-size:1.3rem}
.hello{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.sun{position:absolute;right:22px;top:18px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#ffd35c,var(--am));box-shadow:0 0 0 0 rgba(246,168,0,.5);animation:pulse3 3s infinite}
@keyframes pulse3{50%{box-shadow:0 0 0 22px rgba(246,168,0,0);transform:scale(1.08)}}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{padding:14px 6px;border-radius:16px;background:var(--in);border:1px solid var(--gb);font-size:.78rem;font-weight:600;display:grid;gap:6px;transition:.25s}
.qa button:hover{transform:translateY(-5px) rotate(-1deg);background:var(--gl)}
.qa em{font-size:1.4rem;font-style:normal}
.feat{margin-top:14px;font-size:.82rem;color:var(--mu);display:grid;gap:6px}
.feat div::before{content:"✓";color:var(--ok);font-weight:800;margin-right:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--in);border:1px solid var(--gb);margin-bottom:8px;font-size:.9rem;transition:.25s}
.row:hover{transform:translateX(4px)}
.row .g{flex:1}.row small{color:var(--mu)}
.tag{font-size:.7rem;padding:3px 9px;border-radius:99px;background:rgba(246,168,0,.2);color:var(--am);font-weight:700}
.cb{width:22px;height:22px;border-radius:50%;border:2px solid var(--pr2);display:grid;place-items:center;flex:none;transition:.25s}
.done .cb{background:var(--ok);border-color:var(--ok)}.done .cb::after{content:"✓";color:#fff;font-size:.75rem;font-weight:800}
.done .g{text-decoration:line-through;opacity:.55}
.seg{display:inline-flex;background:var(--in);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{padding:8px 18px;border-radius:11px;font-weight:600;font-size:.85rem;color:var(--mu);transition:.25s}
.seg button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.add{display:flex;gap:8px;margin-top:8px}.add input{margin:0;flex:1}.add button{width:46px;border-radius:14px;background:var(--pr);color:#fff;font-size:1.3rem;font-weight:700}
.habits{display:flex;justify-content:space-between;gap:6px}
.hb{display:grid;gap:6px;justify-items:center;font-size:.75rem;color:var(--mu)}
.hb button{width:38px;height:38px;border-radius:50%;border:2px solid var(--gb);background:var(--in);transition:.3s;font-weight:800;color:#fff}
.hb button.on{background:var(--ok);border-color:var(--ok);animation:bounce .5s}
@keyframes bounce{40%{transform:scale(1.3)}}
.hero{padding:22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero b{font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.03em}
.up{color:var(--ok);font-size:.85rem;font-weight:700}
.donutw{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.lg{display:grid;gap:12px;font-size:.88rem}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.ring path,.ring circle{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal b{font-size:.75rem;color:var(--mu);padding:6px 0}
.cal button{aspect-ratio:1;border-radius:50%;font-weight:600;font-size:.88rem;transition:.25s;max-width:44px;margin:auto;width:100%}
.cal button:hover{background:var(--in)}.cal .out{opacity:.35}
.cal .sel{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 16px rgba(45,111,154,.45);transform:scale(1.1)}
.cal .ev{box-shadow:inset 0 0 0 2px var(--am)}
.calh{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px}
.calh button{width:34px;height:34px;border-radius:10px;background:var(--in)}
.time{font-weight:700;color:var(--pr2);width:48px;font-size:.85rem}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;gap:4px;padding:8px;z-index:30;max-width:calc(100vw - 20px);animation:rise .9s .3s both}
.dock button{padding:10px 14px;border-radius:14px;font-size:.82rem;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap;transition:.25s}
.dock button:hover{background:var(--in);transform:translateY(-3px)}
@media(max-width:700px){.dock button span{display:none}.dock button{font-size:1.2rem}}
.help{display:none;position:fixed;inset:0;z-index:70;place-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
.help.open{display:grid}.help .glass{width:min(420px,92vw);padding:24px;animation:rise .4s both}
.stag>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.stag>*:nth-child(2){animation-delay:.1s}.stag>*:nth-child(3){animation-delay:.2s}.stag>*:nth-child(4){animation-delay:.3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 $$('#cs button').forEach(b=>{b.onclick=()=>{S.cm=b.textContent;$$('#cs button').forEach(x=>x.classList.toggle('on',x===b));G()}});G()},
study(){crud($('#sj'),{arr:'sch',fields:[{k:'n',p:'Mata pelajaran',req:1},{k:'d',p:'Tanggal',t:'date',req:1},{k:'tm',p:'Jam',t:'time'}],sort:(a,b)=>(a.d+a.tm).localeCompare(b.d+b.tm),def:()=>({d:'2025-11-11',tm:'16:00'}),row:x=>`${esc(x.n)}<br><small>${fmtD(x.d)} · ${x.tm||'--:--'}</small>`,add:'Tambah jadwal',empty:'Belum ada jadwal belajar.'});

 $('#ss').onclick=()=>{const t=+$('#tg').value,u=+$('#us').value;if(!(t>0)){$('#se').textContent='Target harus lebih dari 0.';return}if($('#us').value===''||!(u>=0)){$('#se').textContent='Jam terpakai tidak valid.';return}S.st={target:t,used:u};go('study')};
 $('#sr').onclick=()=>{S.st.used=0;go('study')}}};

/* FINANCIAL CRUD */
function fin(){const F={f:'all',e:0,d:0,t:'out'},q=id=>$('#'+id),sum=t=>S.tx.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
const setT=t=>{F.t=t;$$('#ft button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))};
const reset=()=>{F.e=0;q('fn').value='';q('fa').value='';q('fe').textContent='';q('fh').textContent='Catat transaksi';q('fs').textContent='Simpan transaksi';q('fx').style.display='none'};
const R=()=>{const i=sum('in'),o=sum('out');q('fb').textContent=rp(i-o);setTimeout(()=>{const d=q('fdn');if(d)d.style.strokeDashoffset=276.5*(1-(i+o?o/(i+o):0))},60);
 q('fg').innerHTML=`<div><i style="background:#3da2bf"></i>Pengeluaran<br><b>${rp(o)}</b></div><div><i style="background:#f6a800"></i>Pemasukan<br><b>${rp(i)}</b></div>`;
 const cs=CATS.map(c=>[c,S.tx.filter(x=>x.t==='out'&&x.c===c).reduce((s,x)=>s+x.a,0)]).filter(c=>c[1]);
 q('fk').innerHTML=cs.length?cs.map(c=>`<div style="margin-bottom:10px;font-size:.85rem"><span style="display:flex;justify-content:space-between"><span>${c[0]}</span><b>${rp(c[1])}</b></span><div class="bar"><i style="width:${c[1]/o*100}%"></i></div></div>`).join(''):'<p class="hint">Belum ada pengeluaran.</p>';
 const L=S.tx.filter(x=>F.f==='all'||x.t===F.f).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
 q('fl').innerHTML=L.length?L.map(x=>{const g=x.t==='in',col=g?'var(--ok)':'var(--no)';return `<div class="row"><span class="cb" style="border-color:${col};color:${col}">${g?'↑':'↓'}</span><div class="g">${esc(x.n)}<br><small>${x.c} · ${fmtD(x.d)}</small></div><b style="color:${col}">${g?'+':'-'} ${rp(x.a)}</b><button class="ic" data-e="${x.id}" aria-label="Ubah">✏️</button><button class="ic" data-x="${x.id}" aria-label="Hapus" ${F.d===x.id?'style="width:auto;padding:0 10px;background:var(--no);color:#fff;font-size:.75rem;font-weight:700"':''}>${F.d===x.id?'Hapus?':'🗑️'}</button></div>`}).join(''):'<p class="hint">Belum ada transaksi. Isi formulir untuk mencatat yang pertama.</p>';
 $$('[data-e]',q('fl')).forEach(b=>b.onclick=()=>{const x=S.tx.find(t=>t.id==b.dataset.e);F.e=x.id;setT(x.t);q('fn').value=x.n;q('fa').value=x.a;q('fc').value=x.c;q('fd').value=x.d;q('fe').textContent='';q('fh').textContent='Ubah transaksi';q('fs').textContent='Simpan perubahan';q('fx').style.display='';q('fn').focus()});
 $$('[data-x]',q('fl')).forEach(b=>b.onclick=()=>{const id=+b.dataset.x;if(F.d===id){S.tx=S.tx.filter(t=>t.id!==id);F.d=0;if(F.e===id)reset();R()}else{F.d=id;R();setTimeout(()=>{if(F.d===id){F.d=0;R()}},3000)}})};
$$('#ft button').forEach(b=>b.onclick=()=>setT(b.dataset.t));
$$('#ff button').forEach(b=>b.onclick=()=>{F.f=b.dataset.f;$$('#ff button').forEach(x=>x.classList.toggle('on',x===b));R()});
q('fx').onclick=reset;
q('fs').onclick=()=>{const n=q('fn').value.trim(),a=+q('fa').value,d=q('fd').value;if(!n){q('fe').textContent='Nama transaksi wajib diisi.';return}if(!(a>0)){q('fe').textContent='Jumlah harus lebih dari 0.';return}if(!d){q('fe').textContent='Pilih tanggal transaksi.';return}const o={n,a:Math.round(a),d,t:F.t,c:q('fc').value};if(F.e)Object.assign(S.tx.find(x=>x.id===F.e),o);else S.tx.push({id:++TXID,...o});reset();R()};
R()}

/* ANIM: count-up, ring, line draw */
function anim(){$$('[data-n]').forEach(el=>{const t=+el.dataset.n,s=performance.now();(function f(n){const k=Math.min(1,(n-s)/1300),e=1-Math.pow(1-k,3);el.textContent=Math.round(t*e).toLocaleString('id-ID');if(k<1)requestAnimationFrame(f)})(s)});
 requestAnimationFrame(()=>setTimeout(()=>$$('[data-off]').forEach(c=>c.style.strokeDashoffset=c.dataset.off),80));
 $$('.draw').forEach(p=>{const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.getBoundingClientRect();p.style.transition='stroke-dashoffset 1.8s ease';p.style.strokeDashoffset=0});
 $$('.fadein').forEach(p=>{p.style.opacity=0;p.style.transition='opacity 2s .6s';requestAnimationFrame(()=>p.style.opacity=1)})}

/* GLOBAL */
const theme=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
const menu=$('#menu');

/* PROFIL & PENGATURAN */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function two(b,fn){let t;b.onclick=()=>{if(b.dataset.arm){clearTimeout(t);fn();return}b.dataset.arm=1;const o=b.innerHTML;b.textContent='Klik lagi untuk konfirmasi';b.style.background='var(--no)';b.style.color='#fff';t=setTimeout(()=>{delete b.dataset.arm;b.innerHTML=o;b.style.background='';b.style.color=''},3000)}}
function openProf(tab){tab=tab||'p';menu.classList.remove('open');const b=$('#pb');$('#prof').classList.add('open');
 const tg=(k,l,on)=>`<div class="row" style="justify-content:space-between"><span>${l}</span><button class="tg ${on?'on':''}" data-k="${k}" role="switch" aria-checked="${!!on}" aria-label="${l}"></button></div>`;
 let h=`<div class="seg">${[['p','Profil'],['s','Pengaturan'],['k','Keamanan']].map(t=>`<button class="${t[0]===tab?'on':''}" data-pt="${t[0]}">${t[1]}</button>`).join('')}</div>`;
 if(tab==='p')h+=`<div style="text-align:center;margin-bottom:12px"><div class="av" style="width:72px;height:72px;font-size:1.8rem;margin:0 auto 8px">${esc(S.user[0].toUpperCase())}</div><b>${esc(S.user)}</b></div><input class="f" id="pn" placeholder="Nama" value="${esc(S.user)}" maxlength="40"><input class="f" id="pe" type="email" placeholder="Email" value="${esc(S.p.email)}"><input class="f" id="pp" placeholder="No. HP (opsional)" value="${esc(S.p.phone)}"><input class="f" id="pbio" placeholder="Bio singkat (opsional)" value="${esc(S.p.bio)}" maxlength="80"><div class="err" id="pmsg"></div><button class="btn" id="psv">Simpan perubahan</button><button class="ghost" id="pcl" style="margin-top:8px">Kosongkan No. HP &amp; bio</button>`;
 else if(tab==='s')h+=tg('notif','Notifikasi aktivitas',S.p.notif)+tg('remind','Pengingat harian',S.p.remind)+tg('dark','Mode gelap',isDark())+`<div class="err" id="pmsg"></div><button class="ghost" id="prs">Hapus semua data aplikasi</button>`;
 else h+=`<input class="f" id="np" type="password" placeholder="Password baru (min. 6 karakter)" autocomplete="new-password"><input class="f" id="nc" type="password" placeholder="Ulangi password baru" autocomplete="new-password"><div class="err" id="pmsg"></div><button class="btn" id="psp">Perbarui password</button><button class="ghost" id="pda" style="margin-top:14px">Hapus akun</button>`;
 b.innerHTML=h;
 const msg=(t,ok)=>{const m=$('#pmsg');m.textContent=t;m.style.color=ok?'var(--ok)':'var(--no)'};
 const wipe=()=>{['todos','tasks','tx','notes','ev','sch','habits'].forEach(k=>{S[k]=[]});S.st={target:30,used:0}};
 $$('[data-pt]',b).forEach(x=>x.onclick=()=>openProf(x.dataset.pt));
 $$('.tg',b).forEach(x=>x.onclick=()=>{const k=x.dataset.k;if(k==='dark')theme();else{S.p[k]=!S.p[k];if(k==='notif')$('#bell .dot').style.display=S.p.notif?'':'none'}openProf('s')});
 if(tab==='p'){$('#psv').onclick=()=>{const n=cap($('#pn').value.trim()),e=$('#pe').value.trim();if(!n){msg('Nama wajib diisi.');return}if(e&&!/^\S+@\S+\.\S+$/.test(e)){msg('Format email belum benar.');return}S.user=n;S.p.email=e;S.p.phone=$('#pp').value.trim();S.p.bio=$('#pbio').value.trim();$('#avt').textContent=n[0].toUpperCase();go(location.hash.slice(1));msg('Profil diperbarui.',1)};
  $('#pcl').onclick=()=>{S.p.phone='';S.p.bio='';$('#pp').value='';$('#pbio').value='';msg('No. HP dan bio dihapus.',1)}}
 if(tab==='s')two($('#prs'),()=>{wipe();go(location.hash.slice(1));msg('Semua data aplikasi sudah dihapus.',1)});
 if(tab==='k'){$('#psp').onclick=()=>{const a=$('#np').value,c=$('#nc').value;if(a.length<6){msg('Password minimal 6 karakter.');return}if(a!==c){msg('Konfirmasi password tidak sama.');return}S.pw=a;$('#np').value='';$('#nc').value='';msg('Password diperbarui.',1)};
  two($('#pda'),()=>{$('#prof').classList.remove('open');wipe();S.user='User';S.p={email:'user@lifeflow.id',phone:'',bio:'',notif:true,remind:true};$('#bell .dot').style.display='';logout()})}}
$('#hx').onclick=()=>$('#help').classList.remove('open');

(()=>{const l=document.createElement('link');l.rel='icon';l.type='image/png';l.href=$('.lg-img').src;document.head.appendChild(l);const a=document.createElement('link');a.rel='apple-touch-icon';a.href=l.href;document.head.appendChild(a)})();
